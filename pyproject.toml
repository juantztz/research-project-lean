[project]
name = "research-lean"
version = "0.1.0"
description = "Python environment of the Lean research project (Jupyter Book 2 documentation)"
requires-python = ">=3.11,<3.14"

dependencies = [
    "jupyter-book>=2.1.0",
]

[project.optional-dependencies]

dev = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "jupyterlab>=4.3",
]

[tool.uv]
package = false          # no Python package: uv only manages the environment
resolution = "highest"
